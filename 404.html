<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Joshua Knott</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#f2f3f0">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    >
    <style>
      :root {
        --paper: #f2f3f0;
        --ink: #121826;
        --muted: #626a79;
        --line: #cfd3d8;
        --blue: #315ef7;
        --coral: #ff6547;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: clamp(1rem, 4vw, 3rem);
        background:
          linear-gradient(rgba(18, 24, 38, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(18, 24, 38, 0.05) 1px, transparent 1px),
          var(--paper);
        background-size: 32px 32px;
        color: var(--ink);
        font-family: "Bricolage Grotesque", sans-serif;
      }

      main {
        position: relative;
        display: grid;
        align-content: end;
        width: min(100%, 1100px);
        min-height: calc(100svh - clamp(2rem, 8vw, 6rem));
        margin: auto;
        padding: clamp(2rem, 7vw, 6rem);
        overflow: hidden;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
      }

      main::before {
        position: absolute;
        top: 8%;
        right: 8%;
        width: clamp(5rem, 16vw, 11rem);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--blue);
        content: "";
      }

      main::after {
        position: absolute;
        top: 7%;
        right: calc(8% + clamp(4rem, 14vw, 10rem));
        width: clamp(1rem, 3vw, 2rem);
        aspect-ratio: 1;
        background: var(--coral);
        content: "";
      }

      .code {
        margin-bottom: 0.8rem;
        color: var(--muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 8ch;
        margin: 0 0 1rem;
        font-size: clamp(4.5rem, 16vw, 11rem);
        font-weight: 500;
        letter-spacing: -0.08em;
        line-height: 0.83;
      }

      p {
        max-width: 32rem;
        margin: 0 0 2rem;
        color: var(--muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: clamp(0.72rem, 1.3vw, 0.88rem);
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        justify-self: start;
        padding: 0.85rem 1rem;
        border: 1px solid var(--ink);
        border-radius: 4px;
        background: var(--ink);
        color: white;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.68rem;
        font-weight: 500;
        text-decoration: none;
        text-transform: uppercase;
        transition:
          transform 160ms ease,
          background-color 160ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        background: var(--blue);
      }

      a:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
      }

      @media (max-width: 540px) {
        main::before {
          top: 5%;
          right: 8%;
        }

        main::after {
          top: 4%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · Wrong turn</p>
      <h1>Nothing lives here.</h1>
      <p>
        The page may have moved, or the link may be out of date. The selected
        work is still waiting on the homepage.
      </p>
      <a href="/">Back to the portfolio <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
